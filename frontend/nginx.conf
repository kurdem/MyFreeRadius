# nginx serving the SPA and proxying the API to the backend on the same origin,
# so session cookies and CSRF work without cross-origin complications.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (spec section 26). CSP is intentionally strict; the SPA
    # ships no inline scripts. 'unsafe-inline' for styles is required by MUI.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    # Resolve the backend at request time via Docker's embedded DNS (127.0.0.11)
    # instead of at startup. Using a variable in proxy_pass defers name
    # resolution, so nginx starts even when the backend is briefly down or
    # starting, instead of crash-looping with "host not found in upstream".
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream "http://backend:8000";
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
