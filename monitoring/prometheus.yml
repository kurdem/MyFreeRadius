# Prometheus configuration for the FreeRADIUS Manager monitoring profile.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: freeradius-manager
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
